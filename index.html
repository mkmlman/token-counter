<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenCounter — know your token bill</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231b365d'/%3E%3Ctext x='50' y='70' font-family='Georgia,serif' font-size='64' fill='%23fdfcf7' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fdfcf7;
      --bg-soft: #f6f4ec;
      --ink: #23241f;
      --muted: #84867a;
      --line: #e2e0d4;
      --line-strong: #d4d2c4;
      --accent: #1b365d;
      --accent-strong: #14294a;
      --accent-soft: #e6ebf2;
      --glow: rgba(27, 54, 93, 0.07);
      --shadow-color: rgba(35, 36, 31, 0.14);
      --serif: "Source Serif 4", Charter, Georgia, "Times New Roman", serif;
      --display: "Fraunces", "Source Serif 4", Charter, Georgia, "Times New Roman", serif;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
      /* dappled light palette (komorebi) */
      --komorebi-light: #fdfaf0;
      --komorebi-mid: #e8a03c;
      --komorebi-shadow: #7c6b52;
      --komorebi-center: 0.45;
      --secondary: #c8482b;
    }
    html[data-theme="dark"] {
      --bg: #211f17;
      --bg-soft: #191812;
      --ink: #eae7db;
      --muted: #9d988a;
      --line: #33312a;
      --line-strong: #403d33;
      --accent: #9db9db;
      --accent-strong: #b6cfe8;
      --accent-soft: rgba(157, 185, 219, 0.12);
      --glow: rgba(157, 185, 219, 0.06);
      --shadow-color: rgba(0, 0, 0, 0.5);
      /* dappled light palette (komorebi) */
      --komorebi-light: #7d97bd;
      --komorebi-mid: #5d7a9e;
      --komorebi-shadow: #101b2c;
      --komorebi-center: 0.38;
      --secondary: #e0552f;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) {
        --bg: #211f17;
        --bg-soft: #191812;
        --ink: #eae7db;
        --muted: #9d988a;
        --line: #33312a;
        --line-strong: #403d33;
        --accent: #9db9db;
        --accent-strong: #b6cfe8;
        --accent-soft: rgba(157, 185, 219, 0.12);
        --glow: rgba(157, 185, 219, 0.06);
        --shadow-color: rgba(0, 0, 0, 0.5);
        --komorebi-light: #7d97bd;
        --komorebi-mid: #5d7a9e;
        --komorebi-shadow: #101b2c;
        --komorebi-center: 0.38;
        --secondary: #e0552f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--serif);
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    /* soft ambient light behind the hero */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(55% 45% at 50% 8%, var(--glow), transparent 70%),
        radial-gradient(35% 30% at 12% 92%, var(--glow), transparent 70%),
        radial-gradient(35% 30% at 88% 90%, var(--glow), transparent 70%);
    }
    /* hairline accent rule across the top */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft) 55%, transparent);
      z-index: 10;
    }
    ::selection { background: var(--accent); color: var(--bg); }
    code {
      font-family: var(--mono);
      font-size: 0.85em;
      line-height: inherit;
      vertical-align: baseline;
      color: var(--ink);
      background: var(--bg-soft);
      border: 1px solid var(--line);
      padding: 0 5px;
      border-radius: 4px;
    }

    /* Entrance choreography */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    .topbar   { animation: rise 0.55s ease both; }
    .hero h1  { animation: rise 0.6s 0.08s ease both; }
    .lede     { animation: rise 0.6s 0.16s ease both; }
    .stage    { animation: rise 0.7s 0.26s ease both; }
    .controls { animation: rise 0.7s 0.38s ease both; }
    footer    { animation: rise 0.7s 0.5s ease both; }

    .topbar,
    .hero,
    footer { position: relative; z-index: 1; }

    /* ------------------------------------------------------------------ */
    /* Dappled light background                                            */
    /* ------------------------------------------------------------------ */
    .dappled-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .dappled-scene > .dappled-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      opacity: 0;
      animation: dappled-fade-in 0.9s ease forwards;
    }
    @keyframes dappled-fade-in {
      to { opacity: 1; }
    }

    /* ------------------------------------------------------------------ */
    /* Top bar                                                              */
    /* ------------------------------------------------------------------ */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 28px;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: var(--bg-soft);
      background: color-mix(in srgb, var(--bg) 42%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .topbar .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .topbar .brand svg { width: 20px; height: 20px; transition: transform 0.5s ease; }
    .topbar .brand:hover svg { transform: rotate(-12deg) scale(1.06); }
    .topbar .brand b { color: var(--ink); font-weight: 600; }
    .topbar .links { display: flex; align-items: center; gap: 10px; color: var(--muted); }

    /* Theme icon toggle — sun and moon morph into each other */
    .theme-toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s ease, background-color 0.2s ease;
    }
    .theme-toggle:hover { color: var(--accent); background: var(--accent-soft); }
    .theme-toggle svg {
      position: absolute;
      width: 17px;
      height: 17px;
      transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .theme-toggle .icon-sun { opacity: 0; transform: rotate(-100deg) scale(0.4); }
    html[data-theme="dark"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(100deg) scale(0.4); }
    html[data-theme="dark"] .theme-toggle .icon-sun { opacity: 1; transform: none; }

    .gh-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
    }
    .gh-link:hover { color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .gh-link:active { transform: translateY(0); }
    .gh-link svg { width: 17px; height: 17px; }

    /* ------------------------------------------------------------------ */
    /* Hero                                                                 */
    /* ------------------------------------------------------------------ */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 24px 40px;
    }
    /* frosted sheet so text and widgets stay legible over the dappled light */
    .sheet {
      width: min(860px, 100%);
      padding: 42px 38px 38px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      background: color-mix(in srgb, var(--bg) 58%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 30px 60px -42px var(--shadow-color);
      animation: rise 0.7s 0.2s ease both;
    }
    .hero h1 {
      font-family: var(--display);
      font-weight: 520;
      font-size: clamp(2.1rem, 5.5vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.015em;
      margin: 0 0 14px;
    }
    .hero h1 em {
      font-style: italic;
      font-weight: 420;
      color: var(--accent);
      position: relative;
      white-space: nowrap;
    }
    /* hand-drawn underline under the italicized phrase */
    .hero h1 em::after {
      content: "";
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: -0.08em;
      height: 0.28em;
      background: var(--accent-soft);
      border-radius: 50%;
      z-index: -1;
    }
    .lede {
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto 36px;
      font-size: 1.02rem;
    }

    .stage {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: stretch;
      justify-content: center;
      margin-bottom: 22px;
      max-width: 860px;
      width: 100%;
    }
    .stage > div { flex: 1; min-width: 210px; }
    .stage .tc__card { max-width: none; }
    .stage > div .tc__card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .stage > div:hover .tc__card {
      transform: translateY(-3px);
      box-shadow: var(--tc-shadow), 0 22px 44px -22px var(--shadow-color);
    }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .btn {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.25s ease, color 0.25s ease,
                  background-color 0.25s ease, transform 0.15s ease,
                  box-shadow 0.25s ease;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -14px var(--shadow-color);
    }
    .btn:active { transform: translateY(0) scale(0.97); }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* the live count gives a tiny pulse when it changes */
    .tc__count.pop {
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    /* ------------------------------------------------------------------ */
    /* Footer                                                               */
    /* ------------------------------------------------------------------ */
    footer {
      padding: 16px 28px 22px;
      text-align: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--bg-soft);
      background: color-mix(in srgb, var(--bg) 42%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
    footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* smooth crossfade when toggling light/dark theme */
    .theme-fade {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.45s ease;
    }
  </style>
  <link rel="stylesheet" href="token-counter.css">
</head>
<body>

  <div class="dappled-scene" aria-hidden="true"></div>

  <div class="topbar">
    <span class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
      <b>TokenCounter</b>
    </span>
    <span class="links">
      <button id="toggle-theme" class="theme-toggle" aria-label="Toggle light/dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="gh-link" href="https://github.com/mkmlman/token-counter" aria-label="GitHub repository">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17 5.7 18 6 18 6c.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
      </a>
    </span>
  </div>

  <main class="hero">
    <div class="sheet">
      <h1>Know your <em>token bill.</em></h1>
      <p class="lede">
        A dependency-free widget that shows token count with a verified/estimated
        badge, model, and cost — in one <code>&lt;link&gt;</code> and one
        <code>&lt;script&gt;</code>. Rendered live below.
      </p>

      <div class="stage">
        <div id="counter-verified"></div>
        <div id="counter-estimated"></div>
        <div id="counter-min"></div>
      </div>

      <div class="controls">
        <button id="live-update" class="btn">+1M tokens</button>
        <button id="toggle-badge" class="btn">Hide / show badge</button>
      </div>
    </div>
  </main>

  <footer>
    MIT licensed · <a href="https://github.com/mkmlman/token-counter#readme">Documentation</a>
  </footer>

  <script src="token-counter.js"></script>
  <script src="dappled-light.js"></script>
  <script>
    var verified = TokenCounter.init({
      target: "#counter-verified",
      tokens: 2841921,
      verified: true,
      model: "GPT-5",
      cost: 42.18
    });

    var estimated = TokenCounter.init({
      target: "#counter-estimated",
      tokens: 1500000000,
      estimated: true,
      model: "Claude 4",
      cost: 9.5
    });

    var minimal = TokenCounter.init({
      target: "#counter-min",
      tokens: 845000
    });

    document.getElementById("live-update").addEventListener("click", function () {
      var state = verified.getState();
      verified.update({ tokens: state.tokens + 1000000 });
      var count = document.querySelector("#counter-verified .tc__count");
      if (count) {
        count.classList.remove("pop");
        void count.offsetWidth;
        count.classList.add("pop");
      }
    });

    document.getElementById("toggle-badge").addEventListener("click", function () {
      var state = verified.getState();
      verified.update({ badge: !state.badge });
    });

    document.getElementById("toggle-theme").addEventListener("click", function () {
      var root = document.documentElement;
      var current = root.getAttribute("data-theme");
      var next = current === "dark" ? "light" : "dark";

      var reduceMotion =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!reduceMotion) {
        var oldBg = getComputedStyle(root).getPropertyValue("--bg").trim() || "#fdfcf7";
        var fade = document.createElement("div");
        fade.className = "theme-fade";
        fade.style.background = oldBg;
        document.body.appendChild(fade);
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("tc-theme", next); } catch (e) {}
        document.dispatchEvent(new CustomEvent("themechange"));
        requestAnimationFrame(function () {
          fade.style.opacity = "0";
        });
        setTimeout(function () { fade.remove(); }, 500);
      } else {
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("tc-theme", next); } catch (e) {}
        document.dispatchEvent(new CustomEvent("themechange"));
      }
    });

    try {
      var saved = localStorage.getItem("tc-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) {}

    // Boot the dappled-light shader (it waits for a "nav" event)
    document.addEventListener("DOMContentLoaded", function () {
      document.dispatchEvent(new CustomEvent("nav"));
    });
    if (document.readyState !== "loading") {
      document.dispatchEvent(new CustomEvent("nav"));
    }
  </script>
</body>
</html>
