<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenCounter — standalone demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #222; }
    h1 { font-size: 1.4rem; }
    p { color: #666; line-height: 1.6; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; margin: 24px 0; }
    .row > div { flex: 1; min-width: 200px; }
    button { font-size: 0.85rem; padding: 8px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    button:hover { background: #f4f4f4; }
    code { background: #f4f4f4; padding: 2px 5px; border-radius: 4px; font-size: 0.85em; }
  </style>
  <link rel="stylesheet" href="token-counter.css">
</head>
<body>
  <h1>TokenCounter — standalone demo</h1>
  <p>
    Two widgets rendered by the same script include. The first is full-featured
    (verified + model + cost), the second shows graceful degradation when only
    <code>tokens</code> is supplied.
  </p>

  <div class="row">
    <div id="counter-verified"></div>
    <div id="counter-min"></div>
  </div>

  <p>
    <button id="live-update">Simulate live update (+1M tokens)</button>
    <button id="toggle-theme">Toggle light/dark</button>
  </p>

  <script src="token-counter.js"></script>
  <script>
    var verified = TokenCounter.init({
      target: "#counter-verified",
      tokens: 2841921,
      verified: true,
      model: "GPT-5",
      cost: 42.18
    });

    var minimal = TokenCounter.init({
      target: "#counter-min",
      tokens: 845000
    });

    document.getElementById("live-update").addEventListener("click", function () {
      var state = verified.getState();
      verified.update({ tokens: state.tokens + 1000000 });
    });

    document.getElementById("toggle-theme").addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", current === "dark" ? "light" : "dark");
    });
  </script>
</body>
</html>
